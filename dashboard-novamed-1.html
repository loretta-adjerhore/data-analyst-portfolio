<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Performance | NovaMed Solutions | Loretta Adjerhore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #C19A5B; --dark: #1A1A1A; --soft: #777777; --header-bg: #1E1E1E; }
    html, body { height: 100%; }
    body { font-family: "Source Sans 3", sans-serif; background: #0d0d0d; color: #fff; height: 100vh; display: grid; grid-template-rows: auto auto 1fr auto; }
    .top-bar { background: var(--header-bg); padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
    .top-bar .brand { font-family: "Playfair Display", serif; color: #fff; font-size: 1rem; text-decoration: none; }
    .top-bar .back { color: #aaa; font-size: 0.82rem; text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; transition: color 0.2s; }
    .top-bar .back:hover { color: var(--gold); }
    .dash-header { background: #111; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #222; }
    .dash-title { font-family: "Playfair Display", serif; color: #fff; font-size: 1rem; }
    .dash-meta { display: flex; align-items: center; gap: 14px; }
    .dash-tag { background: var(--gold); color: #fff; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; border-radius: 3px; }
    .dash-counter { color: #888; font-size: 0.8rem; }
    .dots { display: flex; gap: 6px; align-items: center; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #444; }
    .dot.active { background: var(--gold); }
    .image-wrap { overflow: auto; display: flex; align-items: center; justify-content: center; background: #0d0d0d; padding: 16px; }
    .image-wrap img { max-width: 100%; max-height: 100%; width: 100%; object-fit: contain; display: block; border-radius: 4px; }
    .bottom-nav { background: #111; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #333; }
    .nav-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 3px; text-decoration: none; border: 2px solid #444; color: #ccc; transition: all 0.2s; white-space: nowrap; }
    .nav-btn:hover { border-color: var(--gold); color: var(--gold); }
    .nav-btn.next { background: var(--gold); border-color: var(--gold); color: #fff; }
    .nav-btn.next:hover { background: #a8823e; border-color: #a8823e; }
    .nav-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }
    .view-case { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 3px; text-decoration: none; border: 2px solid #444; color: #aaa; transition: all 0.2s; white-space: nowrap; }
    .view-case:hover { border-color: #aaa; color: #fff; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="brand">Loretta Adjerhore</a>
    <a href="project-pharma.html#dashboards" class="back"><i class="fas fa-arrow-left"></i> Back to NovaMed Solutions</a>
  </div>
  <div class="dash-header">
    <div class="dash-title">NovaMed Solutions &mdash; Sales Performance</div>
    <div class="dash-meta">
      <span class="dash-tag">Power BI</span>
      <span class="dash-counter">1 of 2</span>
      <div class="dots"><span class="dot active"></span><span class="dot"></span></div>
    </div>
  </div>
  <div class="image-wrap">
    <img src="images/novamed-dashboard1.jpg" alt="Sales Performance" />
  </div>
  <div class="bottom-nav">
    <span class="nav-btn disabled"><i class="fas fa-arrow-left"></i> First Dashboard</span>
    <a href="project-pharma.html" class="view-case"><i class="fas fa-file-alt"></i> View Case Study</a>
    <a href="dashboard-novamed-2.html" class="nav-btn next">Customer Analysis <i class="fas fa-arrow-right"></i></a>
  </div>
</body>
</html>
